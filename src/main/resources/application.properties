spring.application.name=JetinnoTelemetry
server.port=8001
server.servlet.context-path=/optima_vending_api
spring.web.resources.cache.period=PT0S
spring.web.resources.chain.cache=false
spring.thymeleaf.cache=false
#server.tomcat.relaxed-path-chars=[]|
server.tomcat.relaxed-query-chars=|,{,},[,],^
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger

tcp.server.port=4567
tcp.china_server.port=4567
china_server_ip=39.104.65.223
inputFrames=inputFrames.txt
expectedFrames=expectedFrames.txt

notifyUrl=

dirForUploadRecipe=http://10.9.2.86:8000/files
dirForUploadProduct=http://saas-ru.jetinno.com//api/control/upload_product
dirForSavedRecipes=C:/Users/vadim.tissen/Jetinno/recipes


spring.datasource.url=${SPRING_DATABASE_URL}
spring.datasource.username=${SPRING_DATABASE_USERNAME}
spring.datasource.password=${SPRING_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
